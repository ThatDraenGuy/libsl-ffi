[package]
name = "libsl-bindings"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[dependencies]
libsl = { path = "../libsl" }
slotmap = "1.1.1"

uniffi.workspace = true

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
